# Default dsh-tool-budget config for DeepSeek Harness profiles.
# Later layers that redefine this plugin config replace the whole object.
- insert:
    - id: dsh-tool-budget
      name: dsh-tool-budget
      config:
        enabled: true
        maxCalls: 80
        exclude:
          - job_output
          - job_list
          - job_kill